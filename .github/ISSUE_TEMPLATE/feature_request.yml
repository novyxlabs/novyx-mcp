name: Feature request
description: Suggest a focused novyx-mcp improvement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What MCP workflow should improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Novyx MCP do differently?
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Install/config
        - Reviewable memory
        - Governed actions
        - Audit/rollback
        - Runtime/cloud tools
        - Documentation
        - Other
    validations:
      required: true
